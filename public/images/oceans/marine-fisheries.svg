<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img">
  <title>Marine fisheries — Fix Planet schematic</title>
  <desc>Share of assessed marine stocks classified as overfished. A status chart, not fishing gear and not a protected-area map.</desc>
  <rect width="1600" height="800" fill="#07141c"/>
  <rect x="180" y="300" width="1240" height="88" rx="8" fill="#1c4d62"/>
  <rect x="180" y="300" width="440.2" height="88" rx="8" fill="#e25b2a"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#e7eef2">
    <text x="180" y="260" font-size="28">Assessed marine stocks</text>
    <text x="180" y="440" font-size="28">35.5% overfished</text>
  </g>
</svg>
