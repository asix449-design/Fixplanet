name: Refresh hazard data

on:
  schedule:
    # Hourly, at minute 17 UTC. Updates public/data/hazards.json on main.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-hazards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch public hazard feeds
        run: node scripts/fetch-hazards.mjs

      - name: Commit public/data/hazards.json when data changed
        # No push trigger on this workflow, and the default GITHUB_TOKEN
        # does not start a new workflow run, so this commit cannot loop it.
        run: |
          if git diff --quiet -- public/data/hazards.json; then
            echo "No change in public/data/hazards.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hazards.json
          git commit -m "Refresh public/data/hazards.json"
          # economy-refresh.yml also pushes to main, so rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
